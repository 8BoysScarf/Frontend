<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="absolute top-8" [class.left-8]="langService.currentLang() === 'en'" [class.right-8]="langService.currentLang() === 'ar'">
    <button (click)="langService.toggleLang()" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50 transition-all uppercase">
      {{ langService.currentLang() === 'ar' ? 'English' : 'عربي' }}
    </button>
  </div>

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex w-16 h-16 bg-indigo-600 rounded-2xl items-center justify-center shadow-xl shadow-indigo-100 mb-4 cursor-pointer" routerLink="/">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
      </div>
      <h2 class="text-3xl font-bold text-slate-900">{{ langService.t('login.title') }}</h2>
      <p class="text-slate-500 mt-2">{{ langService.t('login.subtitle') }}</p>
    </div>

    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 p-8 border border-slate-100">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div *ngIf="errorMessage" class="p-4 bg-red-50 border border-red-100 text-red-600 text-sm rounded-xl">
          {{ errorMessage }}
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">{{ langService.t('login.email') }}</label>
          <input 
            type="email" 
            formControlName="email"
            placeholder="name@example.com"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-slate-400"
          >
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-sm font-semibold text-slate-700">{{ langService.t('login.password') }}</label>
            <a href="#" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700 transition-colors">{{ langService.t('login.forgotPass') }}</a>
          </div>
          <input 
            type="password" 
            formControlName="password"
            placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-slate-400"
          >
        </div>

        <div class="flex items-center">
          <input 
            type="checkbox" 
            id="rememberMe" 
            formControlName="rememberMe"
            class="w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500"
          >
          <label for="rememberMe" class="mx-2 block text-sm text-slate-600 font-medium">{{ langService.t('login.rememberMe') }}</label>
        </div>

        <button 
          type="submit" 
          [disabled]="loginForm.invalid || isLoading"
          class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 hover:shadow-indigo-200 transition-all disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.98]"
        >
          <span *ngIf="!isLoading">{{ langService.t('login.submit') }}</span>
          <span *ngIf="isLoading" class="flex items-center justify-center">
            <svg class="animate-spin h-5 w-5 mx-3 text-white" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </span>
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-slate-100 text-center">
        <p class="text-sm text-slate-600">
          {{ langService.t('login.noAccount') }} 
          <a routerLink="/register" class="font-bold text-indigo-600 hover:text-indigo-700 transition-colors">{{ langService.t('login.createAccount') }}</a>
        </p>
      </div>
    </div>
  </div>
</div>
